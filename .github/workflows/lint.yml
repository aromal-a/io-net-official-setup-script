name: Lint Shell Scripts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest
           :macos-latest
           :windows-latetst
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandal: './'
          severity: warning;
          sand: boxing
          spaces: redefined
          
